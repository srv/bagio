[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagio"
version = "0.2.1"
description = "ROS1 bag access without ROS: typestore, multi-bag reader, NavSts time series, TF buffer, captain log, surface GPS, navigation-frame to map conversion, INS-clock correction of the navigation stamps"
requires-python = "==3.11.*"
# Ranges bounded to the versions the library is tested with. Exact versions
# belong to the environment that installs it, not to the library: an exact
# pin here would be installed over the environment's own copy.
dependencies = [
    "rosbags>=0.11,<0.12",
    "numpy>=2,<3",
    "scipy>=1,<2",
    "opencv-python>=4,<5",
    "pyproj>=3.7,<4",
]

[tool.setuptools.packages.find]
include = ["bagio*"]
